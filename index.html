<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#171a28" />
    <title>我们的婚礼故事</title>
    <link rel="stylesheet" href="./styles.css?v=final-ui-1" />
  </head>
  <body>
    <section id="experience-choice" class="experience-choice" hidden aria-labelledby="experience-choice-title">
      <div class="experience-choice-card">
        <p class="eyebrow">CHOOSE YOUR JOURNEY</p>
        <h2 id="experience-choice-title">想怎样看我们的故事？</h2>
        <div class="experience-options">
          <a class="experience-option interactive-option" href="./?mode=interactive&amp;level=meet">
            我想互动，得看看王郅臻又整了什么活
          </a>
          <a class="experience-option autoplay-option" href="./autoplay/?level=meet">
            我懒得点，直接给我放动画
          </a>
        </div>
      </div>
    </section>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">OUR WEDDING JOURNEY</p>
          <h1>王郅臻与梁晓媛的婚礼故事</h1>
        </div>
      </header>

      <section id="game-stage" class="game-stage" aria-label="婚礼故事">
        <canvas id="game-canvas" tabindex="0"></canvas>
        <div class="hud" aria-live="polite">
          <span>TOGETHER</span>
          <strong id="counter-value">0</strong>
        </div>
        <div id="status-pill" class="status-pill">点击画面开始奔跑</div>
        <aside id="debug-overlay" class="debug-overlay" aria-label="调试信息"></aside>
        <div id="photo-modal" class="photo-modal" hidden aria-modal="true" role="dialog">
          <div class="photo-card">
            <p id="photo-title" class="photo-title"></p>
            <div id="single-photo-content" class="single-photo-content">
              <img id="photo-image" alt="婚纱照" />
              <span class="photo-loading" aria-live="polite">照片载入中…</span>
            </div>
            <div id="gallery-stage" class="gallery-stage" hidden aria-label="三张照片轮播">
              <img class="gallery-photo" alt="故乡照片一" />
              <img class="gallery-photo" alt="故乡照片二" />
              <img class="gallery-photo" alt="故乡照片三" />
              <div id="gallery-dots" class="gallery-dots" aria-live="polite"></div>
            </div>
            <p id="photo-caption" class="photo-caption"></p>
          </div>
        </div>
        <div id="loading-overlay" class="loading-overlay">
          <div class="loading-card">
            <span>载入婚礼故事</span>
            <progress id="loading-progress" max="100" value="0"></progress>
            <strong id="loading-label">0%</strong>
          </div>
        </div>
      </section>

    </main>
    <audio
      id="background-audio"
      src="./assets/audio/Ground_Theme.mp3"
      preload="auto"
      loop
      playsinline
      webkit-playsinline
      aria-hidden="true"
    ></audio>
    <script type="module" src="./src/main.js?v=final-ui-1"></script>
  </body>
</html>
