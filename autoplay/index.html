<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#171a28" />
    <base href="../" />
    <title>我们的婚礼故事 · 自动播放</title>
    <link rel="stylesheet" href="./styles.css?v=final-ui-1" />
  </head>
  <body data-experience="autoplay">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">OUR WEDDING JOURNEY · AUTO PLAY</p>
          <h1>王郅臻与梁晓媛的婚礼故事</h1>
        </div>
      </header>

      <section id="game-stage" class="game-stage" aria-label="婚礼故事自动播放">
        <canvas id="game-canvas" tabindex="0"></canvas>
        <div class="hud" aria-live="polite">
          <span>TOGETHER</span>
          <strong id="counter-value">0</strong>
        </div>
        <div id="status-pill" class="status-pill">故事即将自动播放</div>
        <aside id="debug-overlay" class="debug-overlay" aria-label="调试信息"></aside>
        <div id="photo-modal" class="photo-modal" hidden aria-modal="true" role="dialog">
          <div class="photo-card">
            <p id="photo-title" class="photo-title"></p>
            <div id="single-photo-content" class="single-photo-content">
              <img id="photo-image" alt="婚纱照" />
              <span class="photo-loading" aria-live="polite">照片载入中…</span>
            </div>
            <div id="gallery-stage" class="gallery-stage" hidden aria-label="照片自动轮播">
              <img class="gallery-photo" alt="照片一" />
              <img class="gallery-photo" alt="照片二" />
              <img class="gallery-photo" alt="照片三" />
              <div id="gallery-dots" class="gallery-dots" aria-live="polite"></div>
            </div>
            <p id="photo-caption" class="photo-caption"></p>
          </div>
        </div>
        <div id="loading-overlay" class="loading-overlay">
          <div class="loading-card">
            <span>载入自动播放版本</span>
            <progress id="loading-progress" max="100" value="0"></progress>
            <strong id="loading-label">0%</strong>
          </div>
        </div>
      </section>

    </main>

    <section id="credits-overlay" class="credits-overlay" hidden aria-label="制作人员名单">
      <iframe id="credits-replay" title="从相遇篇重新播放的虚焦背景" tabindex="-1" aria-hidden="true"></iframe>
      <div class="credits-veil"></div>
      <div class="credits-card">
        <p><span>制作：王郅臻，ChatGPT</span><span class="credit-tab">创意：王郅臻</span></p>
        <p>出场人物：王郅臻，梁晓媛，阿贝尔</p>
        <p>技术/场景/素材支持：ChatGPT</p>
      </div>
    </section>

    <audio
      id="background-audio"
      src="./assets/audio/Ground_Theme.mp3"
      preload="auto"
      autoplay
      loop
      playsinline
      webkit-playsinline
      aria-hidden="true"
    ></audio>
    <script type="module" src="./src/main.js?v=final-ui-2"></script>
  </body>
</html>
